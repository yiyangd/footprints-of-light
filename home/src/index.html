.g-brace .zh { font-weight: 500; }

.lamp { position: absolute; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; width: var(--sz); height: var(--sz); border-radius: 50%; --sz: 30px; }
.lamp svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.lamp.trunk { --sz: 48px; } .lamp.parallel { --sz: 36px; } .lamp.cont { --sz: 16px; }
.lamp .body { fill: #4a4553; stroke: rgba(246,239,225,.4); stroke-width: 1; }
.lamp .glow { opacity: 0; transition: opacity .5s; }
/* 没点着的灯：只画一圈火苗的轮廓 */
.lamp .flame { fill: none; stroke: rgba(246,239,225,.3); stroke-width: 1; stroke-dasharray: 2 2; }
.lamp.ready .body, .lamp.started .body, .lamp.kindled .body { fill: #b4683f; stroke: #e2a06f; }
.lamp.ready .flame, .lamp.started .flame, .lamp.kindled .flame { fill: #fff4d6; stroke: none; }
.lamp.ready .glow, .lamp.started .glow { opacity: .55; animation: breathe 2.4s ease-in-out infinite; }
.lamp.kindled .glow { opacity: 1; }
@keyframes breathe { 50% { opacity: .95; } }
.lamp.cont { background: #2a2732; border: 1.5px solid rgba(246,239,225,.45); }
.lamp.cont.kindled { background: #b4683f; border-color: #e2a06f; }
.lamp::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--lamp); opacity: 0; transition: opacity .25s; }
.lamp.hl::after { opacity: .45; border-style: dashed; }
.lamp.sel::after { opacity: 1; box-shadow: 0 0 14px rgba(255,207,122,.45); }
.lamp:hover::after { opacity: .7; }
.lb { position: absolute; left: 50%; translate: -50% 0; white-space: nowrap; font-size: 11.5px; font-weight: 700; color: var(--ink-dim); text-align: center; line-height: 1.25; pointer-events: none; }
.lamp.up .lb { bottom: calc(100% + 3px); }
.lamp.down .lb, .lamp.mid .lb { top: calc(100% + 3px); }
.lamp.cont .lb { font-size: 10.5px; font-weight: 600; }
.lamp.trunk .lb { font-size: 13px; color: var(--ink); }
.lamp.trunk .lb .zh { display: block; margin: 0; font-size: 12px; font-weight: 500; }
.lamp .lb .zh { margin-left: .3em; font-weight: 500; }
.lamp.sel .lb, .lamp.kindled .lb, .lamp.ready .lb, .lamp.started .lb { color: #ffe7b3; }

/* ---------- 窄屏和矮屏 ---------- */
@media (max-width: 1100px) { .s-hint { display: none; } }
@media (max-width: 900px) { #counts .lbl { display: none; } }
@media (max-width: 640px) {
  :root { --river-h: 204px; }
  .brand .h1 { font-size: 18px; } .brand svg { width: 30px; height: 30px; } .brand .sub { font-size: 10px; }
  #card { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(var(--river-total) + 8px); max-height: min(50vh, calc(100% - var(--top-h) - var(--river-total) - 16px)); padding: 14px 16px 12px; }
  #card h2 { font-size: 25px; }
  #mapctl .txt .zh { display: none; }
  #counts { padding: 6px 10px; } #counts .c2 { display: none; }
  .chip-btn { padding: 6px 10px; }
}
/* 竖着拿的手机：卡片先只露出最要紧的几行，点“详情”再展开，免得把地图盖住 */
@media (max-width: 640px) and (min-height: 501px) {
  .c-toggle { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink-dim); }
  .c-toggle .zh { font-weight: 500; margin-left: .3em; }
  #card.peek .c-more { display: none; }
  #card:not(.peek) .c-toggle i { rotate: 180deg; }
}
@media (max-width: 480px) { .brand .h1 { font-size: 16px; } .brand .h1 .zh { display: none; } }
/* 横着拿的手机：很矮，河和灯都缩小，卡片靠右、可以盖住河 */
@media (max-height: 500px) {
  :root { --river-h: 136px; }
  #top { padding-top: max(5px, env(safe-area-inset-top)); padding-bottom: 5px; }
  .brand svg { width: 28px; height: 28px; } .brand .h1 { font-size: 17px; } .brand .sub { display: none; }
  #seasonbar { padding-top: 4px; padding-bottom: 2px; } .s-tab { height: 24px; min-width: 24px; font-size: 11.5px; }
  #card { left: auto; top: calc(var(--top-h) + 6px); bottom: 6px; right: max(6px, env(safe-area-inset-right)); width: 318px; max-height: none; padding: 12px 14px; }
  #card h2 { font-size: 23px; margin-top: 8px; }
  #mapctl { bottom: 6px; } #eden { top: 6px; padding: 4px 10px 4px 6px; font-size: 12px; }
  .chip-btn { padding: 5px 10px; font-size: 12px; } #mapctl .sq { width: 28px; padding: 5px 0; }
  .lamp { --sz: 20px; } .lamp.trunk { --sz: 32px; } .lamp.parallel { --sz: 24px; } .lamp.cont { --sz: 12px; }
  .lb, .lamp.trunk .lb { font-size: 10.5px; } .lamp.trunk .lb .zh { display: inline; margin-left: .3em; font-size: 10.5px; }
  .s-head { top: 2px; font-size: 10.5px; } .s-empty { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="brand" id="btn-cover">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs><radialGradient id="tg" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#fff2c8"/><stop offset=".45" stop-color="#ffcf7a" stop-opacity=".7"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient></defs>
        <circle cx="50" cy="40" r="36" fill="url(#tg)"/>
        <path d="M50 22c6 8 7 13 0 22c-7-9-6-14 0-22z" fill="#fff4d6"/>
        <path d="M18 56c10 10 54 10 64 0c-2 14-14 22-32 22S20 70 18 56z" fill="#b4683f"/>
        <path d="M78 57c6-2 12-1 14 2c-5 2-9 4-14 4z" fill="#9c5634"/>
      </svg>
      <span class="bt">
        <span class="h1" id="t-title"></span>
        <span class="sub" id="t-sub"></span>
      </span>
    </button>
    <div class="sp"></div>
    <div id="counts" aria-live="polite"></div>
    <button class="chip-btn" id="btn-lang" title="English / English + 中文 (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 3.6 5.6 3.6 8.5s-1 5.9-3.6 8.5M12 3.5C9.4 6.1 8.4 9.1 8.4 12s1 5.9 3.6 8.5"/></svg><span id="lang-text">EN + 中</span></button>
  </header>

  <main id="mapwrap">
    <svg id="map" role="group"></svg>
    <button id="eden"></button>
    <div id="mapctl">
      <button class="chip-btn txt" id="v-world"></button>
      <button class="chip-btn txt" id="v-israel"></button>
      <button class="chip-btn sq" id="v-in">+</button>
      <button class="chip-btn sq" id="v-out">−</button>
    </div>
  </main>

  <nav id="riverwrap">
    <div id="seasonbar"></div>
    <div id="river"><div id="river-inner"></div></div>
  </nav>
</div>

<aside id="card" hidden></aside>

<div id="cover">
  <div>
    <svg class="lampmark" viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="tg2" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#fff2c8"/><stop offset=".45" stop-color="#ffcf7a" stop-opacity=".7"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient></defs>
      <circle cx="50" cy="40" r="36" fill="url(#tg2)"/>
      <path d="M50 22c6 8 7 13 0 22c-7-9-6-14 0-22z" fill="#fff4d6"/>
      <path d="M18 56c10 10 54 10 64 0c-2 14-14 22-32 22S20 70 18 56z" fill="#b4683f"/>
      <path d="M78 57c6-2 12-1 14 2c-5 2-9 4-14 4z" fill="#9c5634"/>
    </svg>
    <h1 id="c-title"></h1>
    <div class="sub" id="c-sub"></div>
    <div class="verse-line" id="c-verse"></div>
    <div class="lang-pick" role="radiogroup" id="c-lang">
      <button type="button" role="radio" data-lang="en" aria-checked="false"></button>
      <button type="button" role="radio" data-lang="bi" aria-checked="true"></button>
    </div>
    <div class="lang-note" id="c-langnote"></div>
    <div class="actions"><button class="primary" id="c-begin"></button></div>
    <div class="credit" id="c-credit"></div>
  </div>
</div>

<!--APP-->
</body>
</html>
