<!DOCTYPE html>
<html lang="en" class="lang-bi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{ui:text.title.bi}}</title>
<!-- 语言：先读上次的选择，避免页面一打开先闪一下中文 -->
<script>try { if (localStorage.getItem('guangzhiyue-lang') === 'en') document.documentElement.className = 'lang-en'; } catch (e) {}</script>
<!-- 标签页上的小图标：一盏灯（直接写在这里，不用另外的文件） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2742%27 r=%2734%27 fill=%27%23ffcf7a%27 opacity=%27.35%27/%3E%3Cpath d=%27M50 20c7 9 8 15 0 25c-8-10-7-16 0-25z%27 fill=%27%23fff4d6%27/%3E%3Cpath d=%27M16 56c10 10 58 10 68 0c-2 15-15 24-34 24S18 71 16 56z%27 fill=%27%23b4683f%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="scene" aria-label="{{ui:page.aria.game}}"></canvas>

<div id="hud" hidden>
  <div id="timeline">
    <div class="tl-book" id="tl-book"></div>
    <div class="tl-label" id="tl-label"></div>
    <div class="tl-sub" id="tl-sub"></div>
    <div class="tl-days" id="tl-days"></div>
  </div>
  <div id="topright">
    <div id="counts"></div>
    <!-- “地图”和下面两个“回到光之地图”按钮：只有从主页进来（网址带 ?from=map）才显示 -->
    <button class="chip-btn" id="btn-map" hidden aria-label="{{ui:page.backToMap.en}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></svg><!--ui:page.hud.map--></button>
    <button class="chip-btn" id="btn-book" aria-label="{{ui:page.aria.journal}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg><!--ui:page.journal--></button>
    <button class="chip-btn" id="btn-sound" aria-label="{{ui:page.aria.sound}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="snd-wave" d="M16 9a4 4 0 0 1 0 6"/></svg><span id="snd-text"><!--ui:text.sound--></span></button>
    <button class="chip-btn" id="btn-lang" aria-label="{{ui:page.aria.language}}" title="{{ui:page.aria.languageTitle}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 3.6 5.6 3.6 8.5s-1 5.9-3.6 8.5M12 3.5C9.4 6.1 8.4 9.1 8.4 12s1 5.9 3.6 8.5"/></svg><span id="lang-text">{{ui:text.langShort.bi}}</span></button>
  </div>
  <div id="hint"></div>
  <div id="toasts"></div>
  <div id="fps" hidden></div>
</div>

<div id="labels"></div>

<div id="touch" hidden>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="touch-buttons">
    <!-- 学会的姿态，两个一排（姿态多了，手机横屏也放得下） -->
    <div id="gesture-buttons">
      <button class="tbtn small" id="t-build" hidden></button>
      <button class="tbtn small" id="t-walkwith" hidden></button>
      <button class="tbtn small" id="t-offer" hidden></button>
      <button class="tbtn small" id="t-name" hidden></button>
      <button class="tbtn small" id="t-rest" hidden></button>
    </div>
    <button class="tbtn" id="t-jump"><!--ui:page.touch.jump:blk--></button>
  </div>
</div>

<div id="story" hidden>
  <div class="bar top"></div><div class="bar bottom"></div>
  <button id="story-skip"><!--ui:page.story.skip--></button>
  <div id="story-box">
    <div id="story-tag" data-k="scripture"></div>
    <div id="story-text"></div>
    <div id="story-next"><!--ui:page.story.next--> ▸</div>
  </div>
</div>

<div id="card-modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="ostracon" id="card-scroll">
      <span class="o-tag" id="card-tag"></span>
      <h3 id="card-title"></h3>
      <p id="card-text"></p>
    </div>
    <div class="card-actions"><button class="primary" id="card-ok"><!--ui:page.card.keep--></button></div>
  </div>
</div>

<div id="book" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="book-title">
    <div class="sheet-head"><h2 id="book-title"><!--ui:page.journal--></h2><button class="x-btn" id="book-close"><!--ui:page.close--></button></div>
    <div class="tabs" role="tablist" id="book-tabs"></div>
    <div class="sheet-body" id="book-body"></div>
  </div>
</div>

<div id="end-screen" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="end-title">
    <div class="sheet-body">
      <div class="end-hero">
        <h2 id="end-title"><!--ui:page.end.title:blk--></h2>
        <p><!--ui:page.end.line1:blk--></p>
        <p><!--ui:page.end.line2:blk--></p>
      </div>
      <div class="stats" id="end-stats"></div>
      <div class="end-actions">
        <button class="primary" id="end-book"><!--ui:page.end.openJournal--></button>
        <button class="ghost" id="end-continue"><!--ui:page.end.keepWalking--></button>
        <button class="ghost" id="end-map" hidden><!--ui:page.backToMap--></button>
      </div>
    </div>
  </div>
</div>

<div id="title-screen">
  <div>
    <svg class="lampmark" viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="tg" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#fff2c8"/><stop offset=".45" stop-color="#ffcf7a" stop-opacity=".7"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient></defs>
      <circle cx="50" cy="40" r="36" fill="url(#tg)"/>
      <path d="M50 22c6 8 7 13 0 22c-7-9-6-14 0-22z" fill="#fff4d6"/>
      <path d="M18 56c10 10 54 10 64 0c-2 14-14 22-32 22S20 70 18 56z" fill="#b4683f"/>
      <path d="M78 57c6-2 12-1 14 2c-5 2-9 4-14 4z" fill="#9c5634"/>
    </svg>
    <h1><!--ui:page.cover.title:blk--></h1>
    <div class="sub"><!--ui:page.cover.sub--></div>
    <div class="verse-line"><!--ui:page.cover.verse:blk--></div>
    <div class="lang-pick" role="radiogroup" aria-label="{{ui:page.aria.languagePick}}">
      <button type="button" role="radio" data-lang="en" aria-checked="false">{{ui:page.cover.langNames.en}}</button>
      <button type="button" role="radio" data-lang="bi" aria-checked="true">{{ui:page.cover.langNames.bi}}</button>
    </div>
    <div class="lang-note" id="lang-note">{{ui:text.langNote.bi}}</div>
    <div class="actions">
      <button class="primary" id="btn-start"><!--ui:page.cover.begin--></button>
      <button class="ghost" id="btn-continue" hidden><!--ui:page.cover.continue--></button>
      <button class="ghost" id="title-map" hidden><!--ui:page.backToMap--></button>
    </div>
    <div class="help">
      <p><!--ui:page.cover.helpDesk:blk:rich--></p>
      <p><!--ui:page.cover.helpPhone:blk--></p>
    </div>
    <div class="credit">
      <p><!--ui:page.cover.credit--></p>
      <p>{{ui:text.bibleNotice}} <span class="site">{{ui:text.bibleSite}}</span></p>
      <p class="zh" lang="zh-CN">{{ui:text.cuvNotice}}</p>
    </div>
  </div>
</div>

<div id="fade"></div>

<!-- 游戏的入口：src/main.ts -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
